[project]
name = "xauusd-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "fastapi>=0.110", "uvicorn[standard]>=0.27", "plotly>=5.18", "scikit-learn>=1.4", "optuna>=3.5", "python-dotenv>=1.0", "ctrader-open-api==0.9.2", "service-identity==24.2.0"]
[project.optional-dependencies]
boosting = ["xgboost>=2.1", "lightgbm>=4.5", "catboost>=1.2"]
sequence = ["torch>=2.4"]
regimes = ["hmmlearn>=0.3"]
ml-all = ["xgboost>=2.1", "lightgbm>=4.5", "catboost>=1.2", "torch>=2.4", "hmmlearn>=0.3"]
dev = ["pytest>=8", "httpx2>=2.10"]
[project.scripts]
xauusd = "xauusd.cli:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["xauusd*"]
exclude = ["reports*", "tests*"]
namespaces = false
