services:
  xauusd:
    build: .
    image: xauusd-research:local
    ports: ["127.0.0.1:${PORT:-8080}:8080"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_TRANSACTION_ISOLATION: ${DATABASE_TRANSACTION_ISOLATION:-read_committed}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      TZ: UTC
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
