services:
  xauusd:
    build: .
    ports: ["8080:8080"]
    env_file: [.env]
    volumes: ["./data:/app/data", "./reports:/app/reports", "./logs:/app/logs"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
